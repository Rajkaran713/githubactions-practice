name : push-2

on : push

jobs:
  build:
    runs-on : ubuntu-latest
    steps:
      - name: show what triggered this run
        run : |
          echo "Event name: $GITHUB_EVEN_NAME"
          echo "Branch Ref: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Actor name: $GITHUB_ACTOR"
